<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6E7BFF"/>
      <stop offset="0.55" stop-color="#4A3FE0"/>
      <stop offset="1" stop-color="#2A1A8C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="padStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="tip" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E6FF"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tipShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- icon body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

  <!-- glass trackpad -->
  <g filter="url(#shadow)">
    <rect x="232" y="300" width="560" height="424" rx="64" fill="url(#pad)"/>
  </g>
  <rect x="233.5" y="301.5" width="557" height="421" rx="62.5" fill="none" stroke="url(#padStroke)" stroke-width="3"/>

  <!-- click ripple around middle finger -->
  <circle cx="512" cy="500" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="512" cy="500" r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="512" cy="500" r="70" fill="#B9C0FF" opacity="0.9" filter="url(#glow)"/>

  <!-- three fingertips -->
  <g filter="url(#tipShadow)">
    <ellipse cx="392" cy="530" rx="40" ry="46" fill="url(#tip)" opacity="0.92"/>
    <ellipse cx="512" cy="500" rx="44" ry="50" fill="url(#tip)"/>
    <ellipse cx="632" cy="530" rx="40" ry="46" fill="url(#tip)" opacity="0.92"/>
  </g>
</svg>
